<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TalkBridge</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
padding:20px;
width:90%;
max-width:400px;
}

.logo{
font-size:42px;
margin-bottom:10px;
}

h1{
margin:10px 0;
}

p{
color:#cbd5e1;
}

select,button{
width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:16px;
}

select{
background:white;
}

.create{
background:#2563eb;
color:white;
}

.join{
background:#16a34a;
color:white;
}
</style>


</head>

<body>

<div class="container">

<div class="logo">🌍</div>

<h1>TalkBridge</h1>

<p>Speak your language. Understand theirs.</p>

<select>
<option>Select Your Language</option>
<option>English</option>
<option>French</option>
<option>Spanish</option>
<option>Arabic</option>
<option>Chinese</option>
<option>German</option>
</select>

<button class="create">Create Conversation</button>

<button class="join">Join Conversation</button>

</div>

</body>
</html>
